<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal & Bazar Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.85), rgba(20, 83, 45, 0.85)), 
                  url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
      background-size: cover; background-attachment: fixed; background-position: center;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #16a34a; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
  </style>
</head>
<body class="font-sans text-gray-800 p-4 md:p-8 min-h-screen">
  <div class="max-w-5xl mx-auto space-y-8">
    <div class="bg-white/90 backdrop-blur-md p-6 rounded-2xl shadow-2xl border-t-4 border-green-500 text-center">
      <h1 class="text-3xl font-extrabold text-green-700 tracking-wide">🥗 Mess Meal & Bazar Dashboard</h1>
      <p class="text-gray-600 text-sm mt-1 font-semibold" id="syncStatus">🔄 Syncing with Database...</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-white/95 backdrop-blur-md p-6 rounded-2xl shadow-xl border border-white/20">
        <h2 class="text-lg font-bold text-gray-800 mb-4 border-b-2 border-green-300 pb-2">🍲 Daily Meal Entry</h2>
        <form id="mealForm" class="space-y-4">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Select Date</label>
            <input type="date" id="mealDate" class="w-full border p-2 rounded-lg" required>
          </div>
          <div id="membersMealContainer" class="grid grid-cols-2 gap-3 mt-4"></div>
          <button type="submit" class="w-full bg-green-600 text-white font-bold py-2.5 px-4 rounded-lg">Save Meals</button>
        </form>
      </div>

      <div class="bg-white/95 backdrop-blur-md p-6 rounded-2xl shadow-xl border border-white/20">
        <h2 class="text-lg font-bold text-gray-800 mb-4 border-b-2 border-blue-300 pb-2">🛒 Bazar Expense Entry</h2>
        <form id="bazarForm" class="space-y-4">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Select Date</label>
            <input type="date" id="bazarDate" class="w-full border p-2 rounded-lg" required>
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Who Shopped?</label>
            <select id="bazarMember" class="w-full border p-2 rounded-lg" required></select>
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Amount (Tk)</label>
            <input type="number" id="bazarAmount" min="1" step="1" class="w-full border p-2 rounded-lg" required>
          </div>
          <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2.5 px-4 rounded-lg mt-2">Save Bazar</button>
        </form>
      </div>
    </div>

    <div id="reportSection" class="bg-white/95 backdrop-blur-md p-6 rounded-2xl shadow-2xl overflow-x-auto border border-white/20">
      <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
        <h2 class="text-xl font-bold text-gray-800">📊 Final Calculation Dashboard</h2>
        <div class="flex items-center gap-3">
          <div class="bg-yellow-100 text-yellow-900 px-4 py-2 rounded-xl font-extrabold text-sm">
            Meal Rate: <span id="displayMealRate">0.00</span> Tk
          </div>
          <button onclick="downloadPDF()" class="bg-indigo-600 text-white text-xs font-bold py-2.5 px-4 rounded-xl shadow">📄 Download PDF</button>
        </div>
      </div>
      
      <table class="min-w-full text-sm text-center text-gray-700 border-collapse border border-gray-300 rounded-lg overflow-hidden">
        <thead class="bg-gray-100 text-gray-900 font-extrabold">
          <tr id="tableHeader"></tr>
        </thead>
        <tbody id="summaryTableBody" class="font-medium"></tbody>
      </table>
      
      <div class="mt-6 text-right">
        <button onclick="clearAllData()" class="bg-red-500 text-white text-xs font-bold py-2.5 px-4 rounded-xl">⚠ Clear All Data (Reset Month)</button>
      </div>
    </div>
  </div>

  <script>
    // আপনার দেওয়া লিংটি এখানে বসানো হয়েছে:
    const API_URL = "https://script.google.com/macros/s/AKfycbz9BtXfM6giFxzK-oGEdkQSMR_yQP6lZcA8loLvqkKT8uN-GApH2Cd_wYWQXAG_O8lV0g/exec"; 
    
    // এন্ট্রি ও এডিটের জন্য সিক্রেট পিন (পরিবর্তন করতে চাইলে এখানে করতে পারেন):
    const SECRET_PIN = "1234";

    const members = ["Ashim", "অঞ্জন", "Amanat", "Habib", "Zonayer", "সম্রাট", "Shihab", "মেহেদী"];
    let dataStore = { meals: {}, bazars: [], preDues: {}, paids: {} };

    async function init() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        if(data && data.meals) { dataStore = data; }
        document.getElementById('syncStatus').innerText = "✅ Synced with Database successfully!";
        document.getElementById('syncStatus').className = "text-green-600 text-sm mt-1 font-bold";
      } catch (e) {
        document.getElementById('syncStatus').innerText = "⚠ Running locally (Offline Mode)";
        document.getElementById('syncStatus').className = "text-red-500 text-sm mt-1 font-bold";
      }
      setupUI();
      updateDashboard();
    }

    function setupUI() {
      const mealCont = document.getElementById('membersMealContainer');
      const bzrSel = document.getElementById('bazarMember');
      mealCont.innerHTML = '';
      bzrSel.innerHTML = '<option value="" disabled selected>-- Select Member --</option>';
      members.forEach(m => {
        mealCont.innerHTML += `<div><label class="block text-xs font-bold text-gray-600 mb-1">${m}</label>
          <input type="number" id="meal_${m}" min="0" step="0.5" value="0" class="w-full border p-2 rounded-lg text-center"></div>`;
        bzrSel.innerHTML += `<option value="${m}">${m}</option>`;
      });
      const t = new Date().toISOString().split('T')[0];
      document.getElementById('mealDate').value = t; document.getElementById('bazarDate').value = t;
    }

    function verifyAction() {
      const p = prompt("🔒 Please enter the Secret PIN:");
      if (p === SECRET_PIN) return true;
      alert("❌ Incorrect PIN!"); return false;
    }

    async function saveDataToCloud() {
      document.getElementById('syncStatus').innerText = "⏳ Saving to cloud...";
      updateDashboard();
      try {
        await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(dataStore),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        document.getElementById('syncStatus').innerText = "✅ Data Saved!";
      } catch (e) {
        document.getElementById('syncStatus').innerText = "⚠ Save failed!";
      }
    }

    document.getElementById('mealForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!verifyAction()) return;
      const d = document.getElementById('mealDate').value;
      const m = {}; members.forEach(n => m[n] = parseFloat(document.getElementById(`meal_${n}`).value) || 0);
      dataStore.meals[d] = m;
      saveDataToCloud(); alert("Meals saved!");
    });

    document.getElementById('bazarForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!verifyAction()) return;
      const d = document.getElementById('bazarDate').value, m = document.getElementById('bazarMember').value, a = parseFloat(document.getElementById('bazarAmount').value)||0;
      dataStore.bazars.push({ date: d, member: m, amount: a });
      saveDataToCloud(); alert("Bazar saved!"); document.getElementById('bazarAmount').value = '';
    });

    function updateDashboard() {
      let t = {}; members.forEach(m => t[m] = { m: 0, b: 0 });
      let gb = 0, gm = 0;
      Object.values(dataStore.meals).forEach(r => members.forEach(m => { t[m].m += (r[m]||0); gm += (r[m]||0); }));
      dataStore.bazars.forEach(b => { if(t[b.member]){ t[b.member].b += b.amount; gb += b.amount; } });
      let r = gm > 0 ? (gb/gm) : 0;
      document.getElementById('displayMealRate').innerText = r.toFixed(2);

      const h = document.getElementById('tableHeader');
      h.innerHTML = `<th class="border bg-blue-100 px-3 py-2">Category</th>` + members.map(m=>`<th class="border bg-gray-200 px-3 py-2 w-24">${m}</th>`).join('') + `<th class="border bg-green-200 px-3 py-2">Total</th>`;

      const bRow = (n, c, vf, tf) => `<tr><td class="${c} border px-3 py-2 font-bold">${n}</td>` + members.map(m=>`<td class="border px-2 py-2">${vf(m)}</td>`).join('') + `<td class="border bg-gray-100 font-bold px-2 py-2">${tf()}</td></tr>`;
      
      const bdy = document.getElementById('summaryTableBody');
      bdy.innerHTML = bRow('Meals', 'bg-white', m=>t[m].m, ()=>gm) +
                      bRow('Bazar', 'bg-blue-50', m=>t[m].b.toFixed(2), ()=>gb.toFixed(2)) +
                      bRow('Consume', 'bg-white', m=>(t[m].m*r).toFixed(2), ()=>gb.toFixed(2));
      
      let pdTotal = 0;
      let pdRow = `<tr><td class="bg-white border px-3 py-2 font-bold">Pre. Due</td>` + members.map(m=>{ let v = dataStore.preDues[m]||0; pdTotal+=v; return `<td class="border p-1"><input type="number" onchange="updVal('preDues','${m}',this.value)" value="${v}" class="w-full text-center border bg-gray-50 text-sm"></td>`;}).join('') + `<td class="border bg-gray-100 font-bold px-2 py-2">${pdTotal.toFixed(2)}</td></tr>`;
      bdy.innerHTML += pdRow;

      bdy.innerHTML += bRow('Payable (দিতে হবে)', 'bg-red-100 text-red-800', m=>{ let s = (t[m].b - (t[m].m*r)) - (dataStore.preDues[m]||0); return s<0 ? Math.abs(s).toFixed(2) : '-'; }, ()=>'-') +
                       bRow('Refund (পাবে)', 'bg-green-100 text-green-800', m=>{ let s = (t[m].b - (t[m].m*r)) - (dataStore.preDues[m]||0); return s>0 ? s.toFixed(2) : '-'; }, ()=>'-');

      let paidT = 0;
      let paidR = `<tr><td class="bg-white border px-3 py-2 font-bold">Paid</td>` + members.map(m=>{ let v = dataStore.paids[m]||0; paidT+=v; return `<td class="border p-1"><input type="number" onchange="updVal('paids','${m}',this.value)" value="${v}" class="w-full text-center border bg-gray-50 text-sm"></td>`;}).join('') + `<td class="border bg-gray-100 font-bold px-2 py-2">${paidT.toFixed(2)}</td></tr>`;
      bdy.innerHTML += paidR;
    }

    window.updVal = function(type, member, value) {
      if (!verifyAction()) { updateDashboard(); return; }
      dataStore[type][member] = parseFloat(value) || 0;
      saveDataToCloud();
    };

    function clearAllData() {
      if (!verifyAction()) return;
      const ans = prompt(`🚨 MATH CHECK!\n33 + 22 - 5 = ?`);
      if (ans === '50') {
        dataStore = { meals: {}, bazars: [], preDues: {}, paids: {} };
        saveDataToCloud(); alert("✅ Data reset!");
      } else { alert("❌ Wrong answer!"); }
    }

    function downloadPDF() {
      html2canvas(document.getElementById('reportSection'), { scale: 2 }).then(canvas => {
        const doc = new window.jspdf.jsPDF('l', 'mm', 'a4');
        doc.addImage(canvas.toDataURL('image/png'), 'PNG', 8, 15, 280, (canvas.height*280)/canvas.width);
        doc.save(`Meal_Report.pdf`);
      });
    }

    init();
  </script>
</body>
</html>
