<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meal & Bazar Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTML to Canvas & jsPDF for PDF Download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <style>
    /* Premium Food Theme Background */
    body {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.85), rgba(20, 83, 45, 0.85)), 
                  url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #16a34a; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
  </style>
</head>
<body class="font-sans text-gray-800 p-4 md:p-8 min-h-screen">

  <div class="max-w-5xl mx-auto space-y-8">
    
    <!-- Header -->
    <div class="bg-white/90 backdrop-blur-md p-6 rounded-2xl shadow-2xl border-t-4 border-green-500 text-center">
      <h1 class="text-3xl font-extrabold text-green-700 tracking-wide">🥗 Mess Meal & Bazar Dashboard</h1>
      <p class="text-gray-600 text-sm mt-1 font-semibold">Automatic Calculations, PDF Reports & Safe Data Management</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Meal Entry Form -->
      <div class="bg-white/95 backdrop-blur-md p-6 rounded-2xl shadow-xl border border-white/20">
        <h2 class="text-lg font-bold text-gray-800 mb-4 border-b-2 border-green-300 pb-2 flex items-center">
          🍲 Daily Meal Entry
        </h2>
        <form id="mealForm" class="space-y-4">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Select Date</label>
            <input type="date" id="mealDate" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-green-500" required>
          </div>
          <div id="membersMealContainer" class="grid grid-cols-2 gap-3 mt-4">
            <!-- Member inputs generated by JS -->
          </div>
          <button type="submit" class="w-full bg-green-600 text-white font-bold py-2.5 px-4 rounded-lg shadow-lg hover:bg-green-700 transition">Save Meals</button>
        </form>
      </div>

      <!-- Bazar Entry Form -->
      <div class="bg-white/95 backdrop-blur-md p-6 rounded-2xl shadow-xl border border-white/20">
        <h2 class="text-lg font-bold text-gray-800 mb-4 border-b-2 border-blue-300 pb-2 flex items-center">
          🛒 Bazar Expense Entry
        </h2>
        <form id="bazarForm" class="space-y-4">
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Select Date</label>
            <input type="date" id="bazarDate" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-500" required>
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Who Shopped?</label>
            <select id="bazarMember" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-500" required>
              <!-- Members generated by JS -->
            </select>
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Amount (Tk)</label>
            <input type="number" id="bazarAmount" min="1" step="1" placeholder="e.g. 1500" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-blue-500" required>
          </div>
          <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2.5 px-4 rounded-lg shadow-lg hover:bg-blue-700 transition mt-2">Save Bazar</button>
        </form>
      </div>
    </div>

    <!-- Summary / Final Calculation Table -->
    <div id="reportSection" class="bg-white/95 backdrop-blur-md p-6 rounded-2xl shadow-2xl overflow-x-auto border border-white/20">
      <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
        <h2 class="text-xl font-bold text-gray-800">📊 Final Calculation Dashboard</h2>
        <div class="flex items-center gap-3">
          <div class="bg-yellow-100 border border-yellow-300 text-yellow-900 px-4 py-2 rounded-xl font-extrabold text-sm shadow-sm">
            Meal Rate: <span id="displayMealRate">0.00</span> Tk
          </div>
          <button onclick="downloadPDF()" class="bg-indigo-600 text-white text-xs font-bold py-2.5 px-4 rounded-xl shadow hover:bg-indigo-700 transition flex items-center gap-1">
            📄 Download PDF
          </button>
        </div>
      </div>
      
      <table class="min-w-full text-sm text-center text-gray-700 border-collapse border border-gray-300 rounded-lg overflow-hidden">
        <thead class="bg-gray-100 text-gray-900 font-extrabold">
          <tr>
            <th class="border border-gray-300 px-2 py-2.5">Category</th>
            <!-- Member Headers injected via JS -->
          </tr>
        </thead>
        <tbody id="summaryTableBody" class="font-medium">
          <!-- Data Rows -->
        </tbody>
      </table>
      
      <div class="mt-6 text-right">
        <button onclick="clearAllData()" class="bg-red-500 text-white text-xs font-bold py-2.5 px-4 rounded-xl hover:bg-red-600 shadow-md transition">⚠ Clear All Data (Reset Month)</button>
      </div>
    </div>

  </div>

  <script>
    const members = ["Ashim", "অঞ্জন", "Amanat", "Habib", "Zonayer", "সম্রাট", "Shihab", "মেহেদী"];
    
    let dataStore = JSON.parse(localStorage.getItem('mealManagerData')) || {
      meals: {}, 
      bazars: [], 
      preDues: {}, 
      paids: {}    
    };

    function init() {
      const mealContainer = document.getElementById('membersMealContainer');
      const bazarMemberSelect = document.getElementById('bazarMember');
      
      mealContainer.innerHTML = '';
      bazarMemberSelect.innerHTML = '<option value="" disabled selected>-- Select Member --</option>';

      members.forEach((name) => {
        mealContainer.innerHTML += `
          <div>
            <label class="block text-xs font-bold text-gray-600 mb-1">${name}</label>
            <input type="number" id="meal_${name}" min="0" step="0.5" value="0" class="w-full border border-gray-300 p-2 rounded-lg focus:ring-2 focus:ring-green-400 text-center">
          </div>
        `;
        bazarMemberSelect.innerHTML += `<option value="${name}">${name}</option>`;
      });

      const today = new Date().toISOString().split('T')[0];
      document.getElementById('mealDate').value = today;
      document.getElementById('bazarDate').value = today;

      updateDashboard();
    }

    document.getElementById('mealForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const date = document.getElementById('mealDate').value;
      const dailyMeals = {};
      
      members.forEach(name => {
        dailyMeals[name] = parseFloat(document.getElementById(`meal_${name}`).value) || 0;
      });

      dataStore.meals[date] = dailyMeals;
      saveData();
      alert(`Meals saved successfully for ${date}!`);
      updateDashboard();
    });

    document.getElementById('bazarForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const date = document.getElementById('bazarDate').value;
      const member = document.getElementById('bazarMember').value;
      const amount = parseFloat(document.getElementById('bazarAmount').value) || 0;

      dataStore.bazars.push({ date, member, amount });
      saveData();
      alert(`${amount} Tk bazar added for ${member}!`);
      document.getElementById('bazarAmount').value = ''; 
      updateDashboard();
    });

    function updateDashboard() {
      let totals = {};
      members.forEach(m => totals[m] = { meals: 0, bazar: 0 });
      let grandTotalBazar = 0;
      let grandTotalMeals = 0;

      Object.values(dataStore.meals).forEach(dailyRecord => {
        members.forEach(m => {
          totals[m].meals += (dailyRecord[m] || 0);
          grandTotalMeals += (dailyRecord[m] || 0);
        });
      });

      dataStore.bazars.forEach(b => {
        if(totals[b.member]) {
          totals[b.member].bazar += b.amount;
          grandTotalBazar += b.amount;
        }
      });

      let mealRate = grandTotalMeals > 0 ? (grandTotalBazar / grandTotalMeals) : 0;
      document.getElementById('displayMealRate').innerText = mealRate.toFixed(2);

      const tbody = document.getElementById('summaryTableBody');
      const theadTr = document.querySelector('thead tr');
      
      theadTr.innerHTML = `<th class="border bg-blue-100 px-3 py-2 text-left">Category</th>`;
      members.forEach(m => {
        theadTr.innerHTML += `<th class="border bg-gray-200 px-3 py-2 w-24">${m}</th>`;
      });
      theadTr.innerHTML += `<th class="border bg-green-200 px-3 py-2">Total</th>`;

      const buildRow = (title, bgClass, valFunc, totalFunc) => {
        let html = `<tr><td class="${bgClass} border px-3 py-2 font-bold text-left">${title}</td>`;
        members.forEach(m => html += `<td class="border px-2 py-2">${valFunc(m)}</td>`);
        html += `<td class="border bg-gray-100 font-bold px-2 py-2">${totalFunc()}</td></tr>`;
        return html;
      };

      tbody.innerHTML = '';
      
      tbody.innerHTML += buildRow('Total Meals', 'bg-white', m => totals[m].meals, () => grandTotalMeals);
      tbody.innerHTML += buildRow('Bazar', 'bg-blue-50', m => totals[m].bazar.toFixed(2), () => grandTotalBazar.toFixed(2));
      tbody.innerHTML += buildRow('Meal Consume', 'bg-white', m => (totals[m].meals * mealRate).toFixed(2), () => grandTotalBazar.toFixed(2));
      tbody.innerHTML += buildRow('Balance', 'bg-blue-100 text-blue-900', m => {
        let bal = totals[m].bazar - (totals[m].meals * mealRate);
        return bal.toFixed(2);
      }, () => '0.00');

      let preDueRow = `<tr><td class="bg-white border px-3 py-2 font-bold text-left">Pre. Due</td>`;
      let totalPreDue = 0;
      members.forEach(m => {
        let val = dataStore.preDues[m] || 0;
        totalPreDue += val;
        preDueRow += `<td class="border p-1"><input type="number" onchange="updateCustomVal('preDues','${m}',this.value)" value="${val}" class="w-full text-center border bg-gray-50 focus:bg-white text-sm rounded"></td>`;
      });
      preDueRow += `<td class="border bg-gray-100 font-bold px-2 py-2">${totalPreDue.toFixed(2)}</td></tr>`;
      tbody.innerHTML += preDueRow;

      // Payable Row
      tbody.innerHTML += buildRow('Payable (দিতে হবে)', 'bg-red-100 text-red-800', m => {
        let bal = totals[m].bazar - (totals[m].meals * mealRate);
        let preDue = dataStore.preDues[m] || 0;
        let finalStatus = bal - preDue;
        return finalStatus < 0 ? Math.abs(finalStatus).toFixed(2) : '-';
      }, () => '-');

      // Refund Row
      tbody.innerHTML += buildRow('Refund (পাবে)', 'bg-green-100 text-green-800', m => {
        let bal = totals[m].bazar - (totals[m].meals * mealRate);
        let preDue = dataStore.preDues[m] || 0;
        let finalStatus = bal - preDue;
        return finalStatus > 0 ? finalStatus.toFixed(2) : '-';
      }, () => '-');

      let paidRow = `<tr><td class="bg-white border px-3 py-2 font-bold text-left">Paid</td>`;
      let totalPaid = 0;
      members.forEach(m => {
        let val = dataStore.paids[m] || 0;
        totalPaid += val;
        paidRow += `<td class="border p-1"><input type="number" onchange="updateCustomVal('paids','${m}',this.value)" value="${val}" class="w-full text-center border bg-gray-50 focus:bg-white text-sm rounded"></td>`;
      });
      paidRow += `<td class="border bg-gray-100 font-bold px-2 py-2">${totalPaid.toFixed(2)}</td></tr>`;
      tbody.innerHTML += paidRow;
    }

    function updateCustomVal(type, member, value) {
      dataStore[type][member] = parseFloat(value) || 0;
      saveData();
      updateDashboard();
    }

    function saveData() {
      localStorage.setItem('mealManagerData', JSON.stringify(dataStore));
    }

    // Harder Math Verification for Reset
    function clearAllData() {
      const a = Math.floor(Math.random() * 40) + 10;
      const b = Math.floor(Math.random() * 40) + 10;
      const c = Math.floor(Math.random() * 20) + 5;
      
      const expectedResult = a + b - c;
      
      const answer = prompt(`🚨 HARD SECURITY CHECK!\nTo prevent accidental deletion, solve this math problem:\n\n${a} + ${b} - ${c} = ?`);
      
      if (answer !== null && parseInt(answer) === expectedResult) {
        localStorage.removeItem('mealManagerData');
        alert("✅ Security passed: All data has been reset for the new month.");
        location.reload(); 
      } else {
        alert("❌ Incorrect answer or cancelled! Reset action blocked.");
      }
    }

    // PDF Export Function
    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const element = document.getElementById('reportSection');

      html2canvas(element, { scale: 2 }).then(canvas => {
        const imgData = canvas.toDataURL('image/png');
        const pdf = new jsPDF('l', 'mm', 'a4'); // Landscape orientation
        
        const imgWidth = 280; 
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        
        pdf.addImage(imgData, 'PNG', 8, 15, imgWidth, imgHeight);
        pdf.save(`Meal_Manager_Report_${new Date().toISOString().split('T')[0]}.pdf`);
      });
    }

    init();
  </script>
</body>
</html>
