<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mess Meal & Bazar Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.88), rgba(20, 83, 45, 0.88)), 
                  url('https://images.unsplash.com/photo-1555396273-367ea4eb4db5?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');
      background-size: cover; background-attachment: fixed; background-position: center;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #16a34a; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
  </style>
</head>
<body class="font-sans text-gray-800 p-3 md:p-6 min-h-screen">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Top Bar Navigation & Header -->
    <div class="bg-white/95 backdrop-blur-md p-5 rounded-2xl shadow-2xl border-t-4 border-green-500 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="text-center md:text-left">
        <h1 class="text-2xl md:text-3xl font-extrabold text-green-700 tracking-wide">🥗 Mess Meal & Bazar Dashboard</h1>
        <p class="text-gray-600 text-xs md:text-sm mt-1 font-semibold" id="syncStatus">🔄 Loading database...</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="adminBtn" onclick="toggleAdminLogin()" class="bg-amber-500 hover:bg-amber-600 text-white text-xs md:text-sm font-bold py-2 px-4 rounded-xl shadow-lg transition flex items-center gap-2">
          🔑 Admin Entry Login
        </button>
      </div>
    </div>

    <!-- ================= ADMIN ENTRY PANEL (Hidden by Default) ================= -->
    <div id="adminPanel" class="hidden bg-slate-900/95 border-2 border-amber-400 p-6 rounded-2xl shadow-2xl text-white space-y-6">
      <div class="flex justify-between items-center border-b border-gray-700 pb-3">
        <h2 class="text-xl font-bold text-amber-400 flex items-center gap-2">⚡ Admin Entry Mode Activated</h2>
        <button onclick="logoutAdmin()" class="bg-red-500 hover:bg-red-600 text-white text-xs font-bold py-1.5 px-3 rounded-lg">Logout Admin</button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-gray-800">
        <!-- Meal Entry Form -->
        <div class="bg-white p-5 rounded-xl shadow">
          <h3 class="text-md font-bold text-green-700 mb-3 border-b pb-1">🍲 Daily Meal Entry</h3>
          <form id="mealForm" class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">Select Date</label>
              <input type="date" id="mealDate" class="w-full border p-2 text-sm rounded-lg" required>
            </div>
            <div id="membersMealContainer" class="grid grid-cols-2 gap-2 mt-2"></div>
            <button type="submit" class="w-full bg-green-600 text-white font-bold py-2 rounded-lg text-sm hover:bg-green-700">Save Meals</button>
          </form>
        </div>

        <!-- Bazar Entry Form -->
        <div class="bg-white p-5 rounded-xl shadow">
          <h3 class="text-md font-bold text-blue-700 mb-3 border-b pb-1">🛒 Bazar Expense Entry</h3>
          <form id="bazarForm" class="space-y-3">
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">Select Date</label>
              <input type="date" id="bazarDate" class="w-full border p-2 text-sm rounded-lg" required>
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">Who Shopped?</label>
              <select id="bazarMember" class="w-full border p-2 text-sm rounded-lg" required></select>
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-700 mb-1">Amount (Tk)</label>
              <input type="number" id="bazarAmount" min="1" step="1" class="w-full border p-2 text-sm rounded-lg" required>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg text-sm hover:bg-blue-700 mt-2">Save Bazar</button>
          </form>
        </div>
      </div>
    </div>

    <!-- ================= PUBLIC DASHBOARD SECTION ================= -->
    <div id="reportSection" class="bg-white/95 backdrop-blur-md p-5 rounded-2xl shadow-2xl overflow-x-auto border border-white/20 space-y-6">
      
      <div class="flex flex-wrap justify-between items-center gap-4 border-b pb-4">
        <div>
          <h2 class="text-xl font-bold text-gray-800">📊 Monthly Final Calculation Dashboard</h2>
          <p class="text-xs text-gray-500">Public View (Read Only)</p>
        </div>
        <div class="flex items-center gap-3">
          <div class="bg-yellow-100 text-yellow-900 border border-yellow-300 px-4 py-2 rounded-xl font-extrabold text-sm shadow-sm">
            Meal Rate: <span id="displayMealRate">0.00</span> Tk
          </div>
          <button onclick="downloadPDF()" class="bg-indigo-600 text-white text-xs font-bold py-2.5 px-4 rounded-xl shadow hover:bg-indigo-700">📄 Download PDF</button>
        </div>
      </div>
      
      <!-- Summary Table -->
      <table class="min-w-full text-xs md:text-sm text-center text-gray-700 border-collapse border border-gray-300 rounded-lg overflow-hidden">
        <thead class="bg-gray-100 text-gray-900 font-extrabold">
          <tr id="tableHeader"></tr>
        </thead>
        <tbody id="summaryTableBody" class="font-medium"></tbody>
      </table>
      
      <!-- Daily Meal Breakdown Log Section -->
      <div class="mt-8 border-t pt-6">
        <h3 class="text-lg font-bold text-gray-800 mb-3 flex items-center gap-2">
          📅 Daily Meal Log (তারিখ অনুযায়ী কার কতটি মিল)
        </h3>
        <div class="overflow-x-auto max-h-80 border rounded-xl">
          <table class="min-w-full text-xs text-center text-gray-700">
            <thead class="bg-gray-200 sticky top-0 font-bold">
              <tr id="historyTableHeader"></tr>
            </thead>
            <tbody id="historyTableBody" class="divide-y divide-gray-200 bg-white"></tbody>
          </table>
        </div>
      </div>

      <div id="adminResetContainer" class="hidden mt-6 text-right border-t pt-4">
        <button onclick="clearAllData()" class="bg-red-500 text-white text-xs font-bold py-2 px-4 rounded-xl hover:bg-red-600">⚠ Clear All Data (Reset Month)</button>
      </div>
    </div>

  </div>

  <script>
    // আপনার দেওয়া অরিজিনাল লিংকটি এখানে বসানো হয়েছে
    const API_URL = "https://script.google.com/macros/s/AKfycbz9BtXfM6giFxzK-oGEdkQSMR_yQP6lZcA8loLvqkKT8uN-GApH2Cd_wYWQXAG_O8lV0g/exec"; 
    
    // এডমিন পাসওয়ার্ড:
    const ADMIN_PASSWORD = "1234";

    let isAdminLoggedIn = false;
    const members = ["Ashim", "অঞ্জন", "Amanat", "Habib", "Zonayer", "সম্রাট", "Shihab", "মেহেদী"];
    let dataStore = { meals: {}, bazars: [], preDues: {}, paids: {} };

    async function init() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        if(data && data.meals) { dataStore = data; }
        document.getElementById('syncStatus').innerText = "✅ Synced with Database";
        document.getElementById('syncStatus').className = "text-green-600 text-xs md:text-sm mt-1 font-bold";
      } catch (e) {
        document.getElementById('syncStatus').innerText = "⚠ Running Offline";
        document.getElementById('syncStatus').className = "text-red-500 text-xs md:text-sm mt-1 font-bold";
      }
      setupUI();
      updateDashboard();
    }

    function setupUI() {
      const mealCont = document.getElementById('membersMealContainer');
      const bzrSel = document.getElementById('bazarMember');
      mealCont.innerHTML = '';
      bzrSel.innerHTML = '<option value="" disabled selected>-- Select Member --</option>';
      
      members.forEach(m => {
        mealCont.innerHTML += `<div><label class="block text-xs font-bold text-gray-600 mb-1">${m}</label>
          <input type="number" id="meal_${m}" min="0" step="0.5" value="0" class="w-full border p-1.5 text-xs rounded-lg text-center"></div>`;
        bzrSel.innerHTML += `<option value="${m}">${m}</option>`;
      });
      const t = new Date().toISOString().split('T')[0];
      document.getElementById('mealDate').value = t; document.getElementById('bazarDate').value = t;
    }

    function toggleAdminLogin() {
      if (isAdminLoggedIn) {
        logoutAdmin();
        return;
      }
      const pass = prompt("🔒 Enter Admin Password to access entry forms:");
      if (pass === ADMIN_PASSWORD) {
        isAdminLoggedIn = true;
        document.getElementById('adminPanel').classList.remove('hidden');
        document.getElementById('adminResetContainer').classList.remove('hidden');
        document.getElementById('adminBtn').innerText = "🔓 Logout Admin";
        document.getElementById('adminBtn').className = "bg-red-500 hover:bg-red-600 text-white text-xs md:text-sm font-bold py-2 px-4 rounded-xl shadow-lg";
        alert("✅ Welcome Admin! Entry Panel Unlocked.");
        updateDashboard();
      } else if (pass !== null) {
        alert("❌ Wrong Password!");
      }
    }

    function logoutAdmin() {
      isAdminLoggedIn = false;
      document.getElementById('adminPanel').classList.add('hidden');
      document.getElementById('adminResetContainer').classList.add('hidden');
      document.getElementById('adminBtn').innerText = "🔑 Admin Entry Login";
      document.getElementById('adminBtn').className = "bg-amber-500 hover:bg-amber-600 text-white text-xs md:text-sm font-bold py-2 px-4 rounded-xl shadow-lg";
      updateDashboard();
    }

    async function saveDataToCloud() {
      document.getElementById('syncStatus').innerText = "⏳ Saving...";
      updateDashboard();
      try {
        await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(dataStore),
          headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        });
        document.getElementById('syncStatus').innerText = "✅ Saved to Cloud!";
      } catch (e) {
        document.getElementById('syncStatus').innerText = "⚠ Save failed!";
      }
    }

    document.getElementById('mealForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!isAdminLoggedIn) return;
      const d = document.getElementById('mealDate').value;
      const m = {}; members.forEach(n => m[n] = parseFloat(document.getElementById(`meal_${n}`).value) || 0);
      dataStore.meals[d] = m;
      saveDataToCloud(); alert("Meals saved successfully!");
    });

    document.getElementById('bazarForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!isAdminLoggedIn) return;
      const d = document.getElementById('bazarDate').value, m = document.getElementById('bazarMember').value, a = parseFloat(document.getElementById('bazarAmount').value)||0;
      dataStore.bazars.push({ date: d, member: m, amount: a });
      saveDataToCloud(); alert("Bazar saved!"); document.getElementById('bazarAmount').value = '';
    });

    function updateDashboard() {
      let t = {}; members.forEach(m => t[m] = { m: 0, b: 0 });
      let gb = 0, gm = 0;
      Object.values(dataStore.meals).forEach(r => members.forEach(m => { t[m].m += (r[m]||0); gm += (r[m]||0); }));
      dataStore.bazars.forEach(b => { if(t[b.member]){ t[b.member].b += b.amount; gb += b.amount; } });
      let r = gm > 0 ? (gb/gm) : 0;
      document.getElementById('displayMealRate').innerText = r.toFixed(2);

      const h = document.getElementById('tableHeader');
      h.innerHTML = `<th class="border bg-blue-100 px-3 py-2">Category</th>` + members.map(m=>`<th class="border bg-gray-200 px-3 py-2 w-24">${m}</th>`).join('') + `<th class="border bg-green-200 px-3 py-2">Total</th>`;

      const bRow = (n, c, vf, tf) => `<tr><td class="${c} border px-3 py-2 font-bold">${n}</td>` + members.map(m=>`<td class="border px-2 py-2">${vf(m)}</td>`).join('') + `<td class="border bg-gray-100 font-bold px-2 py-2">${tf()}</td></tr>`;
      
      const bdy = document.getElementById('summaryTableBody');
      bdy.innerHTML = bRow('Total Meals', 'bg-white', m=>t[m].m, ()=>gm) +
                      bRow('Bazar (টাকা)', 'bg-blue-50', m=>t[m].b.toFixed(2), ()=>gb.toFixed(2)) +
                      bRow('Meal Cost', 'bg-white', m=>(t[m].m*r).toFixed(2), ()=>gb.toFixed(2));
      
      let pdTotal = 0;
      let pdRow = `<tr><td class="bg-white border px-3 py-2 font-bold">Pre. Due</td>` + members.map(m=>{ 
        let v = dataStore.preDues[m]||0; pdTotal+=v; 
        return `<td class="border p-1">${isAdminLoggedIn ? `<input type="number" onchange="updVal('preDues','${m}',this.value)" value="${v}" class="w-full text-center border bg-gray-50 text-xs">` : `<span>${v}</span>`}</td>`;
      }).join('') + `<td class="border bg-gray-100 font-bold px-2 py-2">${pdTotal.toFixed(2)}</td></tr>`;
      bdy.innerHTML += pdRow;

      bdy.innerHTML += bRow('Payable (দিতে হবে)', 'bg-red-100 text-red-800', m=>{ let s = (t[m].b - (t[m].m*r)) - (dataStore.preDues[m]||0); return s<0 ? Math.abs(s).toFixed(2) : '-'; }, ()=>'-') +
                       bRow('Refund (পাবে)', 'bg-green-100 text-green-800', m=>{ let s = (t[m].b - (t[m].m*r)) - (dataStore.preDues[m]||0); return s>0 ? s.toFixed(2) : '-'; }, ()=>'-');

      let paidT = 0;
      let paidR = `<tr><td class="bg-white border px-3 py-2 font-bold">Paid</td>` + members.map(m=>{ 
        let v = dataStore.paids[m]||0; paidT+=v; 
        return `<td class="border p-1">${isAdminLoggedIn ? `<input type="number" onchange="updVal('paids','${m}',this.value)" value="${v}" class="w-full text-center border bg-gray-50 text-xs">` : `<span>${v}</span>`}</td>`;
      }).join('') + `<td class="border bg-gray-100 font-bold px-2 py-2">${paidT.toFixed(2)}</td></tr>`;
      bdy.innerHTML += paidR;

      renderHistoryTable();
    }

    // Render Daily History Table
    function renderHistoryTable() {
      const histHeader = document.getElementById('historyTableHeader');
      const histBody = document.getElementById('historyTableBody');
      
      histHeader.innerHTML = `<th class="p-2 border">Date</th>` + members.map(m => `<th class="p-2 border">${m}</th>`).join('');
      histBody.innerHTML = '';

      const dates = Object.keys(dataStore.meals).sort().reverse(); // Sort latest dates first
      
      if (dates.length === 0) {
        histBody.innerHTML = `<tr><td colspan="${members.length + 1}" class="p-4 text-gray-400">No meal records added yet.</td></tr>`;
        return;
      }

      dates.forEach(d => {
        let row = `<tr><td class="p-2 border font-bold bg-gray-50">${d}</td>`;
        members.forEach(m => {
          let count = dataStore.meals[d][m] || 0;
          row += `<td class="p-2 border ${count > 0 ? 'font-semibold text-green-700' : 'text-gray-400'}">${count}</td>`;
        });
        row += `</tr>`;
        histBody.innerHTML += row;
      });
    }

    window.updVal = function(type, member, value) {
      if (!isAdminLoggedIn) return;
      dataStore[type][member] = parseFloat(value) || 0;
      saveDataToCloud();
    };

    function clearAllData() {
      if (!isAdminLoggedIn) return;
      const ans = prompt(`🚨 MATH SECURITY CHECK!\n30 + 20 - 10 = ?`);
      if (ans === '40') {
        dataStore = { meals: {}, bazars: [], preDues: {}, paids: {} };
        saveDataToCloud(); alert("✅ All data reset!");
      } else { alert("❌ Wrong answer!"); }
    }

    function downloadPDF() {
      html2canvas(document.getElementById('reportSection'), { scale: 2 }).then(canvas => {
        const doc = new window.jspdf.jsPDF('l', 'mm', 'a4');
        doc.addImage(canvas.toDataURL('image/png'), 'PNG', 8, 15, 280, (canvas.height*280)/canvas.width);
        doc.save(`Meal_Report.pdf`);
      });
    }

    init();
  </script>
</body>
</html>
